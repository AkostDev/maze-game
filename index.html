<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Волшебный клубок</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Пиксельная игра-лабиринт: собирай находки, открывай дверцы, обходи сторожей — с каждым уровнем чуть сложнее.">
  <meta name="theme-color" content="#1B2B34">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Клубок">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preload" href="assets/fonts/Tiny5-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Tiny5-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Tiny5'; font-weight: 400; font-display: block;
      src: url(assets/fonts/Tiny5-cyrillic.woff2) format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: 'Tiny5'; font-weight: 400; font-display: block;
      src: url(assets/fonts/Tiny5-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    html, body {
      margin: 0; height: 100%; background: #1B2B34; overflow: hidden; overscroll-behavior: none;
      touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; image-rendering: pixelated; touch-action: none; outline: none; }
    /* Невидимая «линейка» для вырезов экрана: её отступы читает src/main.js */
    #safe {
      position: fixed; inset: 0; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
      font: 24px/1.4 'Tiny5', system-ui, sans-serif; color: #F4E9D4;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="safe"></div>
  <div id="boot">Загрузка…</div>
  <script>
    // ES-модули не работают при открытии файла двойным кликом — подсказываем, как запустить
    if (location.protocol === 'file:') {
      document.getElementById('boot').textContent = 'Игра запускается через локальный сервер: выполните «npm start» и откройте http://localhost:8080';
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
